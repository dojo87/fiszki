name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows app
        run: dotnet publish .\IrregularVerbTrainer.csproj --configuration Release --runtime win-x64 --self-contained true --output .\publish

      - name: Package app
        env:
          VERSION: ${{ inputs.version }}
        run: Compress-Archive -Path .\publish\* -DestinationPath ".\IrregularVerbTrainer-$env:VERSION-win-x64.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:VERSION"
          gh release create $tag ".\IrregularVerbTrainer-$env:VERSION-win-x64.zip" --title $tag --generate-notes
